<!-- ===========================================================================
     Campaign announcement bar.

     Partials in this build system are plain HTML with {{ token }} substitution
     and cannot branch, so this file holds NO campaign logic at all. The single
     live/after decision is made once, at build time, by campaignState() in
     src/templates/_blocks.mjs; the page template puts the already-resolved
     values on `meta` and this partial just prints them.

     NOTE: never write this partial's own include token inside this comment.
     expandPartials() in build.mjs is recursive and does not skip comments, so
     a mention of it here expands into six nested copies of the bar.

     Contract for any page that includes the campaign-bar partial — set on meta:
       meta.campaignKey      "live" | "after"   (dismissal key; a state change
                                                 re-shows a bar the reader hid)
       meta.campaignEyebrow  short state label
       meta.campaignCta      the one link's text
       meta.campaignUrl      the one link's href
       meta.campaignRel      "noopener" for an off-site campaign URL, else ""

     Constraints, enforced in blog.css: <= 3rem tall, one line, one link.
     It must never push the answer block below the fold — an intrusive top
     interstitial is a page-experience problem and, worse, it displaces the
     exact block answer engines quote.

     Dismissal is progressive enhancement (src/js/blog.js). With JS off the bar
     simply stays visible, which is the correct default.
     ======================================================================= -->
<div class="aeo-bar" data-campaign-bar data-campaign-key="{{ meta.campaignKey }}">
  <div class="wrap aeo-bar__inner">
    <p class="aeo-bar__text">
      <span class="aeo-bar__eyebrow">{{ meta.campaignEyebrow }}</span>
      <a class="aeo-bar__link" href="{{ meta.campaignUrl }}" rel="{{ meta.campaignRel }}">{{ meta.campaignCta }}</a>
    </p>
    <button class="aeo-bar__close" type="button" data-campaign-dismiss hidden
            aria-label="Dismiss this announcement">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</div>
