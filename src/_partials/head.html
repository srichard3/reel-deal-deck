<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ meta.fullTitle }}</title>
<meta name="description" content="{{ meta.description }}">
<link rel="canonical" href="{{ meta.canonical }}">
<meta name="robots" content="{{ meta.robots }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ meta.fullTitle }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:url" content="{{ meta.canonical }}">
<meta property="og:image" content="{{ meta.ogImage }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ meta.fullTitle }}">
<meta name="twitter:description" content="{{ meta.description }}">
<meta name="twitter:image" content="{{ meta.ogImage }}">

<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1310" media="(prefers-color-scheme: dark)">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- PNG fallback: Safari's SVG-favicon support is recent and patchy, and a
     browser that skips the SVG would otherwise show no icon at all. -->
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/flies.css">
<link rel="stylesheet" href="/styles/commerce.css">
<script>document.documentElement.classList.remove('no-js');
(function(){try{var t=localStorage.getItem('rdd-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
