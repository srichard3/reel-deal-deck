<header class="site-header" data-header>
  <div class="wrap site-header__inner">
    <a class="brand" href="/" aria-label="{{ site.name }} — home">
      {{> joker-fish }}
      <span class="brand__word">The Reel Deal Deck</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <ul class="site-nav__list">
        <li><a href="/deck/">The Deck</a></li>
        <li><a href="/story/">Our Story</a></li>
        <li><a href="/flies/">Fly-brary</a></li>
      </ul>
    </nav>

    <div class="site-header__actions">
      <!-- Wholesale sits beside Order now rather than in the nav: it is for a
           different visitor entirely, and a shop owner should not have to go
           hunting. Ghost, not primary — Order now stays the one filled button
           on the page, so the two never compete. Both are hidden below 62rem
           by `.site-header__actions .btn`; the drawer below carries it there,
           pointed at the same resolved URL. -->
      <a class="btn btn--ghost btn--sm" href="{{ meta.wholesaleUrl }}">Wholesale</a>
      <a class="btn btn--primary btn--sm" href="{{ meta.orderUrl }}" rel="{{ meta.orderRel }}" target="{{ meta.orderTarget }}">Order now</a>
      <button class="nav-toggle" type="button" data-nav-toggle
              aria-expanded="false" aria-controls="mobile-nav" aria-label="Menu">
        <span class="nav-toggle__bar" aria-hidden="true"></span>
        <span class="nav-toggle__bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <!-- Three items in the top bar, in this order: The Deck, Our Story, Fly-brary.
       The Virtual Guide, the flashcards and What's in the deck are deliberately
       absent from both lists — they all live inside the Fly-brary, which is the
       hub for everything that is not the product or the people. Gifts and
       Wholesale sit below the fold of this drawer and in the footer. -->
  <div class="mobile-nav" id="mobile-nav" hidden>
    <ul>
      <li><a href="/deck/">The Deck</a></li>
      <li><a href="/story/">Our Story</a></li>
      <li><a href="/flies/">Fly-brary</a></li>
      <li><a href="/conservation/">Conservation</a></li>
      <li><a href="/gifts/">Gifts</a></li>
      <li><a href="{{ meta.wholesaleUrl }}">Wholesale</a></li>
    </ul>
    <a class="btn btn--primary btn--block" href="{{ meta.orderUrl }}" rel="{{ meta.orderRel }}" target="{{ meta.orderTarget }}">{{ meta.orderCta }}</a>
  </div>
</header>
