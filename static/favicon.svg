<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="The Reel Deal Deck">
  <title>The Reel Deal Deck</title>
  <!--
    The brand mark: a playing-card corner index — the rank letter R above a
    suit glyph. Drawn as paths, not text, so it renders identically everywhere
    (favicons get no font stack). Theme-aware: browser chrome is often dark,
    and a near-black mark disappears against it.
  -->
  <style>
    .ink  { fill: #16191C }
    .suit { fill: #A32B33 }
    @media (prefers-color-scheme: dark) {
      .ink  { fill: #ECE8E0 }
      .suit { fill: #D2565E }
    }
  </style>

  <!-- Rank: R. Outer contour + counter, evenodd so the bowl stays open. -->
  <path class="ink" fill-rule="evenodd" d="
    M10 3
    h7.4
    c3.5 0 5.6 1.9 5.6 4.9
    c0 2.3 -1.3 3.9 -3.5 4.5
    l4 5.9
    h-3.7
    l-3.5 -5.4
    h-2.5
    v5.4
    H10
    Z
    M13.8 5.9
    v4.1
    h3.4
    c1.7 0 2.6 -0.7 2.6 -2.05
    c0 -1.35 -0.9 -2.05 -2.6 -2.05
    Z
  "/>

  <!-- Suit: diamond. -->
  <path class="suit" d="M16 21 L21 26 L16 31 L11 26 Z"/>
</svg>
