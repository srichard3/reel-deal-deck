# ---------------------------------------------------------------------------
# The Reel Deal Deck — Netlify configuration
#
# Headers and redirects are NOT defined here on purpose. They live in
# static/_headers and static/_redirects, which build.mjs copies verbatim to the
# dist root. One source of truth means they can never drift, and the same two
# files work unchanged on Cloudflare Pages if we ever move. Netlify gives
# _headers/_redirects precedence over this file anyway, so duplicating them
# here would only create a trap for whoever edits the wrong one.
#
# See docs/DEPLOY.md for the click-by-click version of all of this.
# ---------------------------------------------------------------------------

[build]
  command  = "npm run build"
  publish  = "dist"
  # There are no dependencies to install; npm ci would fail without a lockfile.
  ignore   = "false"

# The one piece of server-side code in the project: netlify/functions holds the
# wholesale signup endpoint, which needs the Shopify Admin token and therefore
# cannot run in a browser. Functions v2, Node 20, zero dependencies — see the
# header of netlify/functions/wholesale-apply.mjs.
#
# NOTE: this is the reason the site has to deploy to Netlify. GitHub Pages
# serves static bytes only; on Pages, /api/wholesale-apply is a 404 and the
# application form has nowhere to post. See docs/WHOLESALE-ACCOUNTS.md.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS    = "--no-audit --no-fund"
  # The generator is dependency-free. Nothing to fetch, nothing to cache.
  NETLIFY_USE_YARN = "false"

  # ---------------------------------------------------------------------------
  # Netlify's secrets scanner fails the build if the VALUE of any environment
  # variable appears in the published output. It has no way to know which of our
  # variables are public, so the keys below are declared non-secret by hand.
  #
  # Every key listed here is already public by design:
  #   WHOLESALE_LIVE        the literal "1" — matches any file containing a digit
  #   SHOPIFY_SHOP_URL      the storefront address; it is every Buy button, and
  #                         it is committed in data/site.json as shop.url
  #   SHOPIFY_STORE_DOMAIN  the myshopify host, likewise committed
  #   SUPPORT_EMAIL         printed on the contact page on purpose
  #   RESEND_FROM           the From: address on outbound mail
  #   EMAIL_LOGO_URL        an image served from this very site
  #
  # SHOPIFY_CLIENT_ID, SHOPIFY_CLIENT_SECRET and RESEND_API_KEY are deliberately
  # NOT listed. Those are credentials, they must never reach dist/, and leaving
  # them scanned means the build fails loudly if one ever does. Do not add them
  # here to make a build pass — a hit on those keys is a real incident. The same
  # rule is enforced locally by scripts/test-wholesale.mjs.
  #
  # Never use SECRETS_SCAN_ENABLED=false. That disables the check for everything,
  # including the three keys above, which is the one outcome this must prevent.
  # ---------------------------------------------------------------------------
  SECRETS_SCAN_OMIT_KEYS = "WHOLESALE_LIVE,SHOPIFY_SHOP_URL,SHOPIFY_STORE_DOMAIN,SUPPORT_EMAIL,RESEND_FROM,EMAIL_LOGO_URL"

# Deploy Previews and branch builds must not be indexable — a preview URL that
# gets crawled competes with the real site for its own keywords. Netlify sets
# X-Robots-Tag: noindex on *.netlify.app automatically, and the check below
# fails the build before a broken preview ever goes up.
[context.production]
  command = "npm run build && npm run check"

[context.deploy-preview]
  command = "npm run build && npm run check"

[context.branch-deploy]
  command = "npm run build && npm run check"

# `netlify dev` mirrors the local dev server so previews behave the same way.
[dev]
  command      = "npm run dev"
  targetPort   = 4173
  publish      = "dist"
  autoLaunch   = false

# No plugins. Netlify's Lighthouse plugin pulls a Chromium download on every
# build for a number we can measure locally; the asset optimiser rewrites
# markup we control precisely. Both are off by design.
